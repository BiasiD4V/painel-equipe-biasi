<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Entrar · Painel Comercial Biasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafaf9;
    --surface: #ffffff;
    --ink: #18181b;
    --ink-soft: #52525b;
    --ink-muted: #a1a1aa;
    --line: #e7e5e4;
    --accent: #18181b;
    --error: #b91c1c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--ink); background: var(--bg);
    -webkit-font-smoothing: antialiased; letter-spacing: -0.005em;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 40px 36px;
    max-width: 400px; width: 100%;
    box-shadow: 0 1px 2px rgba(0,0,0,0.02);
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
  .brand-mark {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--ink); color: var(--surface);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600;
  }
  .brand h1 { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 500; letter-spacing: -0.02em; }
  .brand p { font-size: 11px; color: var(--ink-muted); }
  h2 { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 500; margin-bottom: 6px; letter-spacing: -0.02em; }
  .sub { font-size: 13px; color: var(--ink-soft); margin-bottom: 24px; }
  label { display: block; font-size: 12px; font-weight: 500; color: var(--ink-soft); margin-bottom: 6px; }
  input {
    width: 100%; padding: 11px 13px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); font-size: 14px; font-family: inherit;
    transition: border .15s, box-shadow .15s;
    -webkit-appearance: none;
  }
  input:focus { outline: none; border-color: var(--ink-soft); box-shadow: 0 0 0 3px rgba(0,0,0,0.04); }
  .field { margin-bottom: 16px; }
  button {
    width: 100%; padding: 12px;
    background: var(--accent); color: var(--surface);
    border: none; border-radius: 8px;
    font-size: 14px; font-weight: 500; font-family: inherit;
    cursor: pointer; transition: opacity .15s;
    margin-top: 8px;
  }
  button:hover { opacity: .9; }
  button:disabled { opacity: .5; cursor: wait; }
  .err {
    background: #fef2f2; color: var(--error);
    padding: 10px 12px; border-radius: 8px;
    font-size: 12px; margin-bottom: 16px;
    border: 1px solid #fee2e2;
    display: none;
  }
  .err.show { display: block; }
  .footer { text-align: center; font-size: 11px; color: var(--ink-muted); margin-top: 24px; }
  @media (max-width: 480px) {
    .card { padding: 32px 24px; border-radius: 12px; }
    h2 { font-size: 22px; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-mark">B</div>
      <div>
        <h1>Biasi Engenharia</h1>
        <p>Painel Comercial</p>
      </div>
    </div>
    <h2>Bem-vindo de volta</h2>
    <p class="sub">Acesse com suas credenciais.</p>
    <div id="err" class="err"></div>
    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" />
      </div>
      <button type="submit" id="btn">Entrar</button>
    </form>
    <div class="footer">© Biasi Engenharia · Acesso restrito</div>
  </div>
<script>
const $ = s => document.querySelector(s);
const err = $('#err');
const btn = $('#btn');

(async () => {
  try {
    const r = await fetch('/api/auth/me', { credentials: 'include' });
    if (r.ok) location.replace('/painel-equipe.html');
  } catch {}
})();

$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  err.classList.remove('show'); err.textContent = '';
  btn.disabled = true; btn.textContent = 'Entrando…';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ email: $('#email').value.trim(), password: $('#password').value })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'erro ao autenticar');
    location.replace('/painel-equipe.html');
  } catch (ex) {
    err.textContent = ex.message || 'falha no login';
    err.classList.add('show');
    btn.disabled = false; btn.textContent = 'Entrar';
  }
});
</script>
</body>
</html>
